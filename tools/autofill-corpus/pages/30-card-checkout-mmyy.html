<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment · Fernwood Market</title>
<style>
  body { margin: 0; font: 14px/1.4 Verdana, sans-serif; background: #f6faf7; color: #233; }
  header { padding: 12px 32px; background: #1f4d2b; color: #fff; font-weight: 700; }
  .wrap { display: grid; grid-template-columns: 1fr 300px; gap: 30px; width: 860px; margin: 30px auto; }
  form { background: #fff; border: 1px solid #d5e0d8; border-radius: 6px; padding: 22px; }
  label { display: block; font-weight: bold; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #9bb3a2; border-radius: 4px; font: inherit; }
  .row { display: flex; gap: 12px; } .row > div { flex: 1; }
  button { margin-top: 16px; width: 100%; padding: 11px; background: #f2c14e; border: 1px solid #c99a2e; border-radius: 4px; font: inherit; font-weight: bold; }
  .summary { background: #fff; border: 1px solid #d5e0d8; border-radius: 6px; padding: 18px; }
</style>
</head>
<body>
<header>Fernwood Market · Secure checkout</header>
<div class="wrap">
  <form id="pay" action="/checkout/pay" method="post">
    <h2 style="margin-top:0">Pay with card</h2>
    <label for="cc-name">Name on card</label>
    <input id="cc-name" name="ccname" autocomplete="cc-name">
    <label for="cc-number">Card number</label>
    <input id="cc-number" name="cardnumber" autocomplete="cc-number" inputmode="numeric">
    <div class="row">
      <div><label for="cc-exp">Expiration date</label><input id="cc-exp" name="cc-exp" autocomplete="cc-exp" placeholder="MM/YY" maxlength="5"></div>
      <div><label for="cc-csc">Security code</label><input id="cc-csc" name="cvc" autocomplete="cc-csc" inputmode="numeric" maxlength="4"></div>
    </div>
    <button type="submit">Place order</button>
  </form>
  <div class="summary"><b>Order summary</b><p>3 items · $62.40</p><p>Delivery: Tomorrow 8–10am</p></div>
</div>
<script>document.getElementById('pay').onsubmit = function (e) { e.preventDefault(); };</script>
</body>
</html>
