name: Feature idea
description: Suggest something new, or a change to how something works.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/octap-app/octapass/blob/main/docs/reference/roadmap.md) first: it may already be planned. Octa Pass has no ads, no trackers and no closed "pro" features, and the server must never be able to read a vault. Ideas that need any of those can't be accepted.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like to happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
  - type: textarea
    id: security
    attributes:
      label: Security or privacy effects
      description: Does this send anything new to the server or a third party, or change how keys are handled?
