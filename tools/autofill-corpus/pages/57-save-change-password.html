<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password · Copperleaf CRM</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #fafaf9; color: #1c1917; }
  nav { background: #c2410c; color: #fff; padding: 12px 28px; }
  .panel { width: 420px; margin: 40px auto; background: #fff; border: 1px solid #e7e5e4; border-radius: 10px; padding: 22px 26px; }
  label { display: block; margin: 10px 0 3px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #d6d3d1; border-radius: 6px; font: inherit; }
  button { margin-top: 16px; padding: 9px 20px; border: 0; border-radius: 6px; background: #c2410c; color: #fff; font: inherit; }
  #saved { color: #15803d; font-weight: 600; }
</style>
</head>
<body>
<nav>Copperleaf CRM · Settings</nav>
<div class="panel">
  <h2 style="margin-top:0">Change your password</h2>
  <form id="change" action="/settings/password" method="post">
    <label for="cp-current">Current password</label>
    <input id="cp-current" name="current_password" type="password">
    <label for="cp-new">New password</label>
    <input id="cp-new" name="new_password" type="password">
    <label for="cp-confirm">Confirm new password</label>
    <input id="cp-confirm" name="confirm_password" type="password">
    <button id="save" type="submit">Save password</button>
  </form>
  <p id="saved" role="status"></p>
</div>
<script>
  document.getElementById('change').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('saved').textContent = 'Password updated';
  });
</script>
</body>
</html>
