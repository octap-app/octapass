<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Gale Weather Pro</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #1e1b4b; color: #e0e7ff; }
  .wrap { width: 360px; margin: 90px auto; background: #312e81; border-radius: 14px; padding: 26px; }
  label { display: block; font-size: 13px; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 9px 11px; border: 1px solid #6366f1; border-radius: 8px; background: #1e1b4b; color: #fff; font: inherit; }
  button { margin-top: 18px; width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #818cf8; color: #1e1b4b; font: inherit; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <h1 style="font-size:21px;margin:0">Gale Weather Pro</h1>
  <form id="login" novalidate>
    <label for="email">Email</label>
    <input id="email" name="email" type="email">
    <label for="password">Password</label>
    <input id="password" name="password" type="password">
    <button id="submit" type="submit">Sign in</button>
  </form>
  <p id="result" role="status"></p>
</div>
<script>
  /* The form never navigates: credentials go out with fetch(), and on success the form is
   * replaced by the signed-in view. */
  var form = document.getElementById('login');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var body = JSON.stringify({ email: form.email.value, password: form.password.value });
    fetch('data:,ok', { method: 'GET' }).then(function (r) { return r.text(); }).then(function () {
      void body;
      form.remove();
      document.getElementById('result').textContent = 'Signed in';
    });
  });
</script>
</body>
</html>
