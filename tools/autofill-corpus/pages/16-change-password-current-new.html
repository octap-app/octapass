<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account · Lumen Wiki</title>
<style>
  body { margin: 0; font: 15px/1.5 -apple-system, system-ui, sans-serif; background: #fafafa; }
  nav { padding: 12px 28px; background: #4338ca; color: #fff; }
  .wrap { max-width: 640px; margin: 30px auto; }
  .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 22px 26px; margin-bottom: 18px; }
  .panel h3 { margin: 0 0 12px; }
  .row { display: flex; gap: 14px; }
  .row div { flex: 1; }
  label { display: block; font-size: 13px; color: #374151; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 9px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; }
  .save { margin-top: 14px; padding: 9px 18px; border: 0; border-radius: 8px; background: #4338ca; color: #fff; font: inherit; }
</style>
</head>
<body>
<nav>Lumen Wiki</nav>
<div class="wrap">
  <div class="panel">
    <h3>Profile</h3>
    <p style="margin:0;color:#6b7280">Signed in as sam@example.test</p>
  </div>
  <div class="panel">
    <h3>Password</h3>
    <form id="pwd-form" action="/account/password" method="post">
      <div class="row">
        <div><label for="old_pass">Current password</label><input type="password" id="old_pass" name="old_pass"></div>
        <div><label for="new_pass">New password</label><input type="password" id="new_pass" name="new_pass"></div>
      </div>
      <button class="save" type="submit">Change password</button>
    </form>
  </div>
</div>
<script>document.getElementById('pwd-form').onsubmit = function (e) { e.preventDefault(); };</script>
</body>
</html>
