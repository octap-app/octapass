# Runs every fuzz target in crates/octapass-core/fuzz for a few minutes each week. Crashes are kept
# as artifacts to reproduce with `cargo +nightly fuzz run <target> <file>`.
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for 4 minutes
        working-directory: crates/octapass-core/fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$target" -- -max_total_time=240 -rss_limit_mb=4096
          done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: crates/octapass-core/fuzz/artifacts
