<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure card entry</title>
<style>
  body { margin: 0; padding: 14px; font: 14px system-ui, sans-serif; background: #fff; }
  label { display: block; font-size: 12px; color: #555; margin: 8px 0 3px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 5px; font: inherit; }
  .row { display: flex; gap: 10px; } .row > div { flex: 1; }
</style>
</head>
<body>
<label for="cardnumber">Card number</label>
<input id="cardnumber" name="cardnumber" autocomplete="cc-number" inputmode="numeric">
<div class="row">
  <div><label for="exp-date">Expiry (MM/YY)</label><input id="exp-date" name="exp-date" autocomplete="cc-exp" placeholder="MM/YY"></div>
  <div><label for="cvc">CVC</label><input id="cvc" name="cvc" autocomplete="cc-csc" inputmode="numeric"></div>
</div>
</body>
</html>
