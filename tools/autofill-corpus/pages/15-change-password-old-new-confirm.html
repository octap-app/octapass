<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security settings · Pebble Bank</title>
<style>
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #f5f7f8; color: #10202c; }
  .top { background: #0f2a3d; color: #fff; padding: 14px 32px; }
  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 30px; padding: 30px 32px; }
  aside a { display: block; padding: 6px 0; color: #2f6f68; }
  section { background: #fff; padding: 24px 28px; border: 1px solid #dde4e8; max-width: 460px; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #94a9b5; font: inherit; }
  button { margin-top: 18px; background: #2f8f83; color: #fff; border: 0; padding: 9px 22px; font: inherit; }
</style>
</head>
<body>
<div class="top">Pebble Bank · Settings</div>
<div class="layout">
  <aside><a href="#">Profile</a><a href="#"><b>Security</b></a><a href="#">Notifications</a><a href="#">Statements</a></aside>
  <section>
    <h2 style="margin-top:0">Change password</h2>
    <form id="pw-change" action="/settings/password" method="post">
      <label for="current">Current password</label>
      <input type="password" id="current" name="current" autocomplete="current-password">
      <label for="next">New password</label>
      <input type="password" id="next" name="next" autocomplete="new-password">
      <label for="next2">Confirm new password</label>
      <input type="password" id="next2" name="next2" autocomplete="new-password">
      <button type="submit">Update password</button>
    </form>
  </section>
</div>
<script>document.getElementById('pw-change').onsubmit = function (e) { e.preventDefault(); };</script>
</body>
</html>
