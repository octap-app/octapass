<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إتمام الشراء · متجر الواحة</title>
<style>
  body { margin: 0; font: 15px/1.6 Tahoma, "Segoe UI", sans-serif; background: #f0fdf4; color: #14532d; }
  .top { background: #166534; color: #fff; padding: 14px 32px; font-size: 18px; }
  .wrap { width: 480px; margin: 36px auto; background: #fff; border-radius: 10px; padding: 24px 28px; }
  h2 { margin: 0 0 16px; font-size: 20px; }
  .f { margin-bottom: 12px; }
  .f label { display: block; font-size: 13px; margin-bottom: 4px; }
  .f input { width: 100%; box-sizing: border-box; padding: 9px; border: 1px solid #86efac; border-radius: 6px; font: inherit; }
  .two { display: flex; gap: 12px; }
  .two .f { flex: 1; }
  .coupon { display: flex; gap: 8px; border-top: 1px dashed #bbf7d0; padding-top: 14px; margin-top: 6px; }
  .coupon input { flex: 1; padding: 8px; border: 1px solid #86efac; border-radius: 6px; font: inherit; }
  button { padding: 10px 20px; border: 0; border-radius: 6px; background: #166534; color: #fff; font: inherit; }
  .pay { width: 100%; margin-top: 16px; }
</style>
</head>
<body>
<div class="top">متجر الواحة</div>
<div class="wrap">
  <h2>الدفع بالبطاقة</h2>
  <form id="checkout" action="/checkout/pay" method="post">
    <div class="f"><label for="card-holder">الاسم على البطاقة</label><input id="card-holder" name="holder_name"></div>
    <div class="f"><label for="card-no">رقم البطاقة</label><input id="card-no" name="card_no" inputmode="numeric" dir="ltr" placeholder="0000 0000 0000 0000"></div>
    <div class="two">
      <div class="f"><label for="card-exp">تاريخ الانتهاء</label><input id="card-exp" name="expiry" dir="ltr" placeholder="MM/YY" maxlength="5"></div>
      <div class="f"><label for="card-cvv">رمز الأمان (CVV)</label><input id="card-cvv" name="cvv" inputmode="numeric" dir="ltr" maxlength="4"></div>
    </div>
    <div class="coupon">
      <input id="coupon" name="coupon" placeholder="رمز الخصم" aria-label="رمز الخصم">
      <button type="button" id="apply-coupon">تطبيق</button>
    </div>
    <button type="submit" class="pay">ادفع ٢٤٠ ر.س</button>
  </form>
</div>
<script>document.getElementById('checkout').onsubmit = function (e) { e.preventDefault(); };</script>
</body>
</html>
