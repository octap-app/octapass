<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – Nimbus Mail</title>
<style>
  body { margin: 0; font: 15px "Roboto", Arial, sans-serif; background: #f0f4f9; }
  .card { width: 420px; margin: 90px auto; background: #fff; border-radius: 26px; padding: 40px; }
  .brand { color: #1a73e8; font-weight: 700; font-size: 20px; }
  h1 { font-weight: 400; font-size: 28px; margin: 18px 0 6px; }
  .sub { color: #555; margin: 0 0 26px; }
  .field { position: relative; }
  .field input { width: 100%; box-sizing: border-box; padding: 16px 14px; border: 1px solid #747775; border-radius: 4px; font: 16px Arial, sans-serif; }
  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 34px; }
  .actions button { background: #0b57d0; color: #fff; border: 0; border-radius: 20px; padding: 10px 24px; font: inherit; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">Nimbus</div>
  <h1>Sign in</h1>
  <p class="sub">Use your Nimbus Account</p>
  <form id="identifier-form" action="/signin/identifier" method="post">
    <div class="field">
      <input id="identifierId" name="identifier" type="email" autocomplete="username" aria-label="Email or phone" placeholder="Email or phone">
    </div>
    <input id="hiddenPassword" name="hiddenPassword" type="password" tabindex="-1" aria-hidden="true" style="display:none">
    <p style="font-size:14px"><a href="#forgot">Forgot email?</a></p>
    <div class="actions">
      <a href="#create">Create account</a>
      <button id="identifierNext" type="submit">Next</button>
    </div>
  </form>
</div>
<script>document.getElementById('identifier-form').onsubmit = function (e) { e.preventDefault(); };</script>
</body>
</html>
