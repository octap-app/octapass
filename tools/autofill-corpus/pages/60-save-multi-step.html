<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Halcyon ID</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #f0fdf4; color: #052e16; }
  .card { width: 380px; margin: 90px auto; background: #fff; border-radius: 14px; padding: 28px; box-shadow: 0 4px 16px rgba(5,46,22,.1); }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #86efac; border-radius: 8px; font: inherit; }
  button { margin-top: 18px; width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #15803d; color: #fff; font: inherit; }
  .acct { background: #dcfce7; border-radius: 999px; padding: 4px 12px; display: inline-block; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1 style="font-size:21px;margin:0 0 6px">Halcyon ID</h1>
  <form id="step1" action="/lookup" method="post">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username">
    <button id="next" type="submit">Next</button>
  </form>
  <form id="step2" action="/login" method="post" hidden>
    <span class="acct" id="acct"></span>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button id="signin" type="submit">Sign in</button>
  </form>
  <p id="status" role="status"></p>
</div>
<script>
  document.getElementById('step1').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value;
    if (!email) return;
    document.getElementById('acct').textContent = email;
    document.getElementById('step1').hidden = true;
    document.getElementById('step2').hidden = false;
    document.getElementById('password').focus();
  });
  document.getElementById('step2').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('status').textContent = 'Signed in';
  });
</script>
</body>
</html>
