<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account settings · Kestrel Invoicing</title>
<style>
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
  .shell { display: flex; min-height: 100vh; }
  nav { width: 200px; background: #0f172a; color: #cbd5e1; padding: 20px; }
  nav a { display: block; color: #cbd5e1; text-decoration: none; padding: 6px 0; }
  nav a.on { color: #fff; font-weight: 600; }
  main { flex: 1; padding: 30px 40px; max-width: 640px; }
  section { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 22px 24px; margin-bottom: 24px; }
  h1 { margin: 0 0 20px; font-size: 22px; }
  h2 { margin: 0 0 14px; font-size: 16px; }
  .fld { margin-bottom: 12px; }
  .fld label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .fld input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
  button { padding: 8px 18px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font: inherit; }
</style>
</head>
<body>
<div class="shell">
  <nav>
    <div style="font-weight:700;color:#fff;margin-bottom:16px">Kestrel</div>
    <a href="#invoices">Invoices</a>
    <a href="#clients">Clients</a>
    <a href="#settings" class="on">Settings</a>
  </nav>
  <main>
    <h1>Account settings</h1>
    <section>
      <h2>Profile</h2>
      <form id="profile" action="/settings/profile" method="post">
        <div class="fld"><label for="p-name">Full name</label><input id="p-name" name="full_name" value="Jordan Lee"></div>
        <div class="fld"><label for="p-email">Email address</label><input id="p-email" name="email" type="email" value="jordan@example.test"></div>
        <div class="fld"><label for="p-phone">Phone</label><input id="p-phone" name="phone" type="tel" value="+15555550123"></div>
        <button type="submit">Save profile</button>
      </form>
    </section>
    <section>
      <h2>Password</h2>
      <form id="security" action="/settings/password" method="post">
        <div class="fld"><label for="pw-current">Current password</label><input id="pw-current" name="current_password" type="password"></div>
        <div class="fld"><label for="pw-new">New password</label><input id="pw-new" name="new_password" type="password"></div>
        <div class="fld"><label for="pw-confirm">Confirm new password</label><input id="pw-confirm" name="new_password_confirm" type="password"></div>
        <button type="submit">Update password</button>
      </form>
    </section>
  </main>
</div>
<script>
  document.getElementById('profile').onsubmit = function (e) { e.preventDefault(); };
  document.getElementById('security').onsubmit = function (e) { e.preventDefault(); };
</script>
</body>
</html>
