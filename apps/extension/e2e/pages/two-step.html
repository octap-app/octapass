<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Turn on two-step sign-in</title>
    <style>
      body { font: 16px system-ui; margin: 3rem; }
      img { display: block; margin-block: 1rem; }
    </style>
  </head>
  <body>
    <h1>Turn on two-step sign-in</h1>
    <p>Scan this QR code with your authenticator app.</p>
    <img id="qr" src="/qr/github.png" alt="QR code" width="270" height="270" />
    <label>Code <input id="code" inputmode="numeric" autocomplete="one-time-code" /></label>
  </body>
</html>
