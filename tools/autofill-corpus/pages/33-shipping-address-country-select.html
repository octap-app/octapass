<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipping · Willow & Co.</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #f7f7f5; color: #1c1917; }
  .bar { padding: 14px 32px; background: #fff; border-bottom: 1px solid #e7e5e4; font-weight: 700; }
  form { width: 560px; margin: 24px auto; background: #fff; border: 1px solid #e7e5e4; border-radius: 8px; padding: 18px 24px; }
  label { display: block; font-size: 12px; color: #57534e; margin: 8px 0 3px; }
  input, select { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #d6d3d1; border-radius: 5px; font: inherit; background: #fff; }
  .two { display: flex; gap: 12px; } .two > div { flex: 1; }
  button { margin-top: 14px; padding: 10px 22px; border: 0; border-radius: 6px; background: #1c1917; color: #fff; font: inherit; }
</style>
</head>
<body>
<div class="bar">Willow &amp; Co. · Checkout</div>
<form id="shipping" action="/checkout/shipping" method="post">
  <h2 style="margin:0 0 4px;font-size:18px">Shipping address</h2>
  <label for="country">Country/Region</label>
  <select id="country" name="country">
    <option value="">Select…</option>
    <option value="AU">Australia</option>
    <option value="CA">Canada</option>
    <option value="DE">Germany</option>
    <option value="MX">Mexico</option>
    <option value="GB">United Kingdom</option>
    <option value="US">United States</option>
  </select>
  <label for="name">Full name</label>
  <input id="name" name="name">
  <label for="addr1">Street address</label>
  <input id="addr1" name="address1" placeholder="Street and number">
  <label for="addr2">Apartment, suite, etc. (optional)</label>
  <input id="addr2" name="address2">
  <div class="two">
    <div><label for="city">City</label><input id="city" name="city"></div>
    <div><label for="region">State</label><input id="region" name="region"></div>
    <div><label for="zip">ZIP code</label><input id="zip" name="zip"></div>
  </div>
  <label for="phone">Phone (for delivery questions)</label>
  <input id="phone" name="phone" type="tel">
  <button type="submit">Continue to payment</button>
</form>
<script>document.getElementById('shipping').onsubmit = function (e) { e.preventDefault(); };</script>
</body>
</html>
