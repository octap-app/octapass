<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会員登録｜さくら書房</title>
<style>
  body { margin: 0; font: 14px/1.7 "Hiragino Sans", "Yu Gothic", sans-serif; background: #fdf2f8; color: #500724; }
  .frame { width: 520px; margin: 30px auto; background: #fff; border: 1px solid #fbcfe8; padding: 22px 30px; }
  table { width: 100%; border-collapse: collapse; }
  th { width: 170px; text-align: left; font-weight: normal; padding: 8px 0; vertical-align: top; }
  th .req { color: #fff; background: #db2777; font-size: 11px; padding: 0 4px; margin-left: 4px; }
  td { padding: 6px 0; }
  td input { width: 100%; box-sizing: border-box; padding: 7px; border: 1px solid #f9a8d4; font: inherit; }
  .btn { text-align: center; margin-top: 16px; }
  .btn button { padding: 10px 50px; border: 0; background: #db2777; color: #fff; font: inherit; }
</style>
</head>
<body>
<div class="frame">
  <h1 style="font-size:20px;margin-top:0">新規会員登録</h1>
  <form id="touroku" action="/member/register" method="post">
    <table>
      <tr><th><label for="f0">お名前</label><span class="req">必須</span></th><td><input id="f0" name="f0" type="text"></td></tr>
      <tr><th><label for="f1">メールアドレス</label><span class="req">必須</span></th><td><input id="f1" name="f1" type="text"></td></tr>
      <tr><th><label for="f2">パスワード</label><span class="req">必須</span></th><td><input id="f2" name="f2" type="password"><small>半角英数字8文字以上</small></td></tr>
      <tr><th><label for="f3">パスワード（確認用）</label><span class="req">必須</span></th><td><input id="f3" name="f3" type="password"></td></tr>
    </table>
    <div class="btn"><button type="submit">登録する</button></div>
  </form>
</div>
<script>document.getElementById('touroku').onsubmit = function (e) { e.preventDefault(); };</script>
</body>
</html>
