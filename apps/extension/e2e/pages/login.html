<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in to Example shop</title>
    <style>
      body { font: 16px system-ui; margin: 3rem; }
      form { display: grid; gap: 0.75rem; max-width: 20rem; }
      input { font: inherit; padding: 0.5rem; }
    </style>
  </head>
  <body>
    <h1>Sign in</h1>
    <form id="login" onsubmit="event.preventDefault()">
      <label>Email <input id="username" type="email" name="email" autocomplete="username" /></label>
      <label>Password <input id="password" type="password" name="password" autocomplete="current-password" /></label>
      <button type="submit">Sign in</button>
    </form>
  </body>
</html>
