<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout · Willow & Co.</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #f7f7f5; color: #1c1917; }
  .bar { padding: 14px 32px; background: #fff; border-bottom: 1px solid #e7e5e4; font-weight: 700; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; padding: 22px 32px; }
  section { background: #fff; border: 1px solid #e7e5e4; border-radius: 8px; padding: 18px 20px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  label { display: block; font-size: 12px; color: #57534e; margin: 8px 0 3px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #d6d3d1; border-radius: 5px; font: inherit; }
  .two { display: flex; gap: 10px; } .two > div { flex: 1; }
  iframe { width: 100%; height: 150px; border: 0; }
  button { margin-top: 12px; width: 100%; padding: 11px; border: 0; border-radius: 6px; background: #1c1917; color: #fff; font: inherit; }
</style>
</head>
<body>
<div class="bar">Willow &amp; Co.</div>
<form id="checkout" class="grid" action="/checkout" method="post">
  <section>
    <h2>Contact and shipping</h2>
    <label for="contact-email">Email</label>
    <input id="contact-email" name="email" type="email" autocomplete="email">
    <label for="ship-name">Full name</label>
    <input id="ship-name" name="ship_name" autocomplete="shipping name">
    <label for="ship-address">Address</label>
    <input id="ship-address" name="ship_address" autocomplete="shipping address-line1">
    <div class="two">
      <div><label for="ship-city">City</label><input id="ship-city" name="ship_city" autocomplete="shipping address-level2"></div>
      <div><label for="ship-zip">ZIP code</label><input id="ship-zip" name="ship_zip" autocomplete="shipping postal-code"></div>
    </div>
  </section>
  <section>
    <h2>Payment</h2>
    <iframe id="card-frame" title="Secure card payment input frame" src="{{CROSS_ORIGIN}}/frames/card.html"></iframe>
    <button type="submit">Pay $48.00</button>
  </section>
</form>
<script>document.getElementById('checkout').onsubmit = function (e) { e.preventDefault(); };</script>
</body>
</html>
