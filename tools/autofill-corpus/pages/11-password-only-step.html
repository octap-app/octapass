<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome – Nimbus Mail</title>
<style>
  body { margin: 0; font: 15px Arial, sans-serif; background: #f0f4f9; }
  .card { width: 420px; margin: 90px auto; background: #fff; border-radius: 26px; padding: 40px; }
  .brand { color: #1a73e8; font-weight: 700; font-size: 20px; }
  h1 { font-weight: 400; font-size: 28px; margin: 18px 0 10px; }
  .chip { display: inline-block; border: 1px solid #c4c7c5; border-radius: 16px; padding: 4px 12px; font-size: 14px; margin-bottom: 26px; }
  label { display: block; font-size: 13px; color: #444; margin-bottom: 4px; }
  input[type=password] { width: 100%; box-sizing: border-box; padding: 16px 14px; border: 1px solid #747775; border-radius: 4px; font: 16px Arial, sans-serif; }
  .show { margin-top: 10px; font-size: 14px; }
  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; }
  .actions button { background: #0b57d0; color: #fff; border: 0; border-radius: 20px; padding: 10px 24px; font: inherit; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">Nimbus</div>
  <h1>Welcome</h1>
  <span class="chip">sam@example.test ▾</span>
  <form id="challenge" action="/signin/challenge/pwd" method="post">
    <input type="hidden" id="acct" name="username" autocomplete="username" value="sam@example.test">
    <label for="Passwd">Enter your password</label>
    <input id="Passwd" name="Passwd" type="password" autocomplete="current-password">
    <label class="show"><input type="checkbox" id="showpw"> Show password</label>
    <div class="actions">
      <a href="#forgot">Forgot password?</a>
      <button type="submit" id="passwordNext">Next</button>
    </div>
  </form>
</div>
<script>
  document.getElementById('showpw').onchange = function () {
    document.getElementById('Passwd').type = this.checked ? 'text' : 'password';
  };
  document.getElementById('challenge').onsubmit = function (e) { e.preventDefault(); };
</script>
</body>
</html>
