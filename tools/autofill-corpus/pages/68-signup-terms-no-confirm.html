<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start your free trial · Tallyloom</title>
<style>
  body { margin: 0; font: 15px/1.5 "Inter", system-ui, sans-serif; background: linear-gradient(135deg, #eef2ff, #fdf4ff); color: #1e1b4b; min-height: 100vh; }
  .card { width: 460px; margin: 50px auto; background: #fff; border-radius: 14px; padding: 30px; box-shadow: 0 10px 30px rgba(30,27,75,.08); }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .lead { margin: 0 0 20px; color: #4338ca; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fld { margin-bottom: 12px; }
  .fld label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .fld input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #c7d2fe; border-radius: 8px; font: inherit; }
  .hint { font-size: 12px; color: #6366f1; margin-top: 3px; }
  .terms { font-size: 13px; margin: 4px 0 18px; }
  button { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; font: inherit; font-weight: 600; }
  #done { margin-top: 12px; font-weight: 600; color: #15803d; }
</style>
</head>
<body>
<div class="card">
  <h1>Start your 14-day free trial</h1>
  <p class="lead">No credit card required.</p>
  <form id="trial" action="/trial" method="post">
    <div class="grid">
      <div class="fld"><label for="fname">First name</label><input id="fname" name="fname"></div>
      <div class="fld"><label for="lname">Last name</label><input id="lname" name="lname"></div>
    </div>
    <div class="fld"><label for="work-email">Work email</label><input id="work-email" name="work_email" type="email"></div>
    <div class="fld">
      <label for="pw">Password</label>
      <input id="pw" name="pw" type="password">
      <div class="hint">At least 8 characters, with a number and a symbol.</div>
    </div>
    <div class="terms"><label><input type="checkbox" id="agree" name="agree"> I agree to the <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a></label></div>
    <button type="submit" id="start">Create account</button>
  </form>
  <div id="done" role="status"></div>
</div>
<script>
  document.getElementById('trial').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('done').textContent = 'Account created. Check your inbox.';
  });
</script>
</body>
</html>
