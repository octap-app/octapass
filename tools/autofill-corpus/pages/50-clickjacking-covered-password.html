<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Pebble Rewards</title>
<style>
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: #0f2a3d; color: #10202c; }
  .top { color: #fff; padding: 18px 40px; font-size: 20px; }
  .panel { width: 380px; margin: 50px auto; background: #fff; padding: 26px 30px; border-top: 5px solid #2f8f83; }
  label { display: block; font-size: 13px; color: #47606f; margin: 12px 0 3px; }
  .in { width: 100%; height: 38px; box-sizing: border-box; padding: 8px; border: 1px solid #94a9b5; font: 15px system-ui, sans-serif; }
  .pw-wrap { position: relative; }
  #cover { position: absolute; inset: 0; z-index: 5; background: #fff; border: 1px solid #94a9b5; box-sizing: border-box; padding: 9px 8px; color: #8a9aa4; font: 15px system-ui, sans-serif; cursor: text; pointer-events: auto; }
  button { margin-top: 16px; background: #2f8f83; color: #fff; border: 0; padding: 9px 22px; font: inherit; }
</style>
</head>
<body>
<div class="top">Pebble Rewards</div>
<div class="panel">
  <h2 style="margin-top:0;font-weight:normal">Log in to see your points</h2>
  <form id="login" action="/login" method="post">
    <label for="user">Username</label>
    <input class="in" id="user" name="user" type="text" autocomplete="username">
    <label for="pass">Password</label>
    <div class="pw-wrap">
      <input class="in" id="pass" name="pass" type="password" autocomplete="current-password">
      <div id="cover">Password</div>
    </div>
    <button type="submit">Log in</button>
  </form>
</div>
<script>
  document.getElementById('cover').addEventListener('mousedown', function (e) {
    e.preventDefault();
    document.getElementById('pass').focus();
  });
  document.getElementById('login').onsubmit = function (e) { e.preventDefault(); };
</script>
</body>
</html>
