<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account · Glimmer Forums</title>
<style>
  body { margin: 0; font: 14px/1.5 Tahoma, Verdana, sans-serif; background: #dfe6ee; }
  .box { width: 420px; margin: 50px auto; background: #fff; border: 1px solid #a9b8c8; padding: 22px 26px; }
  label { display: block; font-weight: bold; margin: 10px 0 3px; }
  .in { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #8fa3b8; font: inherit; }
  button { margin-top: 16px; padding: 8px 20px; background: #3b5a7a; color: #fff; border: 0; font: inherit; }
  .visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(1px, 1px, 1px, 1px); white-space: nowrap; }
  .trap { display: none; }
</style>
</head>
<body>
<div class="box">
  <h2 style="margin-top:0">Join Glimmer Forums</h2>
  <form id="join" action="/join" method="post">
    <label for="su-email">Email</label>
    <input class="in" id="su-email" name="su_email" type="email">
    <label for="su-pass">Password</label>
    <input class="in" id="su-pass" name="su_pass" type="password">
    <label for="su-pass2">Repeat password</label>
    <input class="in" id="su-pass2" name="su_pass2" type="password">

    <div class="trap" aria-hidden="true">
      <label>Leave this empty <input id="hp-website" name="website" type="text"></label>
      <input id="hp-pass" name="password" type="password">
    </div>
    <input id="hp-confirm-email" class="visually-hidden" name="confirm_email" type="email" tabindex="-1" autocomplete="off">
    <input id="hp-fixed-pass" name="new_password" type="password" tabindex="-1" style="position:fixed;top:-500px;left:0">
    <button type="submit">Create account</button>
  </form>
</div>
<script>document.getElementById('join').onsubmit = function (e) { e.preventDefault(); };</script>
</body>
</html>
