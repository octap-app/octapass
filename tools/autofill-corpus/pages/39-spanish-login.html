<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Librería Brisa</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #fef9c3; color: #3f3a10; }
  .card { width: 360px; margin: 80px auto; background: #fff; padding: 26px; border-radius: 10px; border: 1px solid #fde047; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input[type=email], input[type=password] { width: 100%; box-sizing: border-box; padding: 9px; border: 1px solid #ca8a04; border-radius: 6px; font: inherit; }
  button { width: 100%; margin-top: 16px; padding: 10px; border: 0; border-radius: 6px; background: #a16207; color: #fff; font: inherit; }
</style>
</head>
<body>
<div class="card">
  <h1 style="font-size:22px;margin-top:0">Iniciar sesión</h1>
  <form id="acceso" action="/acceso" method="post">
    <label for="correo">Correo electrónico</label>
    <input type="email" id="correo" name="correo">
    <label for="clave">Contraseña</label>
    <input type="password" id="clave" name="clave">
    <label style="font-weight:normal;font-size:14px"><input type="checkbox" id="recordarme" name="recordarme"> Recordarme</label>
    <button type="submit">Entrar</button>
  </form>
  <p style="font-size:13px;text-align:center"><a href="#olvido">¿Olvidaste tu contraseña?</a></p>
</div>
<script>document.getElementById('acceso').onsubmit = function (e) { e.preventDefault(); };</script>
</body>
</html>
