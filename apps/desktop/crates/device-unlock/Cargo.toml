[package]
name = "octapass-device-unlock"
description = "Device unlock for the Octa Pass desktop app: Touch ID or the Mac password, Windows Hello, polkit."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# An in-memory platform for tests of code that uses device unlock.
fake = []

[dependencies]
thiserror.workspace = true
zeroize.workspace = true
rand_core.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework-sys = { version = "2.17", features = ["OSX_10_15"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError", "block2"] }
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Security_Credentials", "Security_Credentials_UI", "Security_Cryptography", "Storage_Streams", "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_StationsAndDesktops"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", features = ["blocking-api"] }
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
octapass-device-unlock = { path = ".", features = ["fake"] }
