<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start your free trial — Tidepool Studio</title>
<style>
  body { margin: 0; font: 15px/1.5 "Inter", system-ui, sans-serif; background: #fff; color: #0f172a; }
  .split { display: grid; grid-template-columns: 1.1fr 1fr; height: 100vh; }
  .left { padding: 70px 70px; }
  .right { background: #ecfeff; padding: 70px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 5px; }
  input { width: 100%; max-width: 420px; box-sizing: border-box; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
  .hint { font-size: 12px; color: #64748b; }
  button { margin-top: 20px; padding: 11px 26px; border: 0; border-radius: 8px; background: #0e7490; color: #fff; font: inherit; font-weight: 600; }
</style>
</head>
<body>
<div class="split">
  <div class="left">
    <h1 style="margin:0">Start your 14-day free trial</h1>
    <p class="hint">No credit card required.</p>
    <form id="trial" action="/trial" method="post">
      <label for="fullname">Full name</label>
      <input id="fullname" name="fullname" type="text">
      <label for="workemail">Work email</label>
      <input id="workemail" name="workemail" type="email">
      <label for="pass">Password</label>
      <input id="pass" name="pass" type="password">
      <div class="hint">Use 12 or more characters with a mix of letters, numbers and symbols.</div>
      <button type="submit">Create account</button>
    </form>
    <p class="hint">Already have an account? <a href="#login">Log in</a></p>
  </div>
  <div class="right"><h2>Design, review and ship together.</h2><p>Tidepool Studio is the shared canvas for product teams.</p></div>
</div>
<script>document.getElementById('trial').onsubmit = function (e) { e.preventDefault(); };</script>
</body>
</html>
