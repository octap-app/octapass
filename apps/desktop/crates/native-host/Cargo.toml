[package]
name = "octapass-native-host"
description = "The native messaging host that lets the Octa Pass browser extension unlock through the desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Helpers for tests of the host and of the app's bridge.
testing = []

[[bin]]
name = "octapass-native-host"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework-sys = "2.17"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
octapass-native-host = { path = ".", features = ["testing"] }
tempfile.workspace = true
