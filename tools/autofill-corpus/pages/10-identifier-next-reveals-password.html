<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cobalt Cloud Console — Sign in</title>
<style>
  body { margin: 0; font: 14px/1.5 "Amazon Ember", Arial, sans-serif; background: #f2f3f3; }
  .top { background: #232f3e; height: 48px; }
  .box { width: 380px; margin: 50px auto; background: #fff; border: 1px solid #d5dbdb; padding: 26px; }
  label { display: block; font-weight: 700; margin-bottom: 4px; }
  input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 7px; border: 1px solid #879596; border-radius: 2px; font: inherit; }
  .btn { width: 100%; margin-top: 16px; padding: 8px; background: #ec7211; border: 1px solid #c45500; color: #fff; font: inherit; font-weight: 700; border-radius: 2px; }
  .who { padding: 8px; background: #f2f8fd; border: 1px solid #c3dbf0; margin-bottom: 12px; }
  #step-password { display: none; }
</style>
</head>
<body>
<div class="top"></div>
<div class="box">
  <h1 style="font-size:20px;margin-top:0">Sign in to Cobalt Cloud</h1>
  <form id="signin" action="/oauth" method="post">
    <div id="step-identifier">
      <label for="identifier">Email address of your account</label>
      <input type="text" id="identifier" name="identifier">
      <button type="button" class="btn" id="next">Next</button>
    </div>
    <div id="step-password">
      <div class="who">Signing in as <b id="who"></b> · <a href="#" id="change">Change</a></div>
      <label for="password">Password</label>
      <input type="password" id="password" name="password">
      <button type="submit" class="btn" id="signin-btn">Sign in</button>
    </div>
  </form>
</div>
<script>
  var form = document.getElementById('signin');
  function goNext() {
    var id = document.getElementById('identifier').value.trim();
    if (!id) return;
    document.getElementById('who').textContent = id;
    document.getElementById('step-identifier').style.display = 'none';
    document.getElementById('step-password').style.display = 'block';
    document.getElementById('password').focus();
  }
  document.getElementById('next').addEventListener('click', goNext);
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (document.getElementById('step-password').style.display !== 'block') goNext();
  });
  document.getElementById('change').addEventListener('click', function (e) {
    e.preventDefault();
    document.getElementById('step-identifier').style.display = 'block';
    document.getElementById('step-password').style.display = 'none';
  });
</script>
</body>
</html>
