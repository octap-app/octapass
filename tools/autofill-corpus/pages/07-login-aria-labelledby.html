<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor HR — Employee portal</title>
<style>
  body { margin: 0; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; background: #eef2f7; }
  .bar { background: #1e3a5f; color: #fff; padding: 14px 36px; font-size: 17px; }
  .grid { display: grid; grid-template-columns: 160px 1fr; gap: 12px 16px; align-items: center; }
  .card { width: 520px; margin: 60px auto 0; background: #fff; padding: 28px 34px; border: 1px solid #cdd6e2; }
  .card input { padding: 7px 9px; border: 1px solid #9fb0c6; border-radius: 3px; font: inherit; }
  .footer { width: 520px; margin: 0 auto; background: #f6f8fb; border: 1px solid #cdd6e2; border-top: 0; padding: 14px 34px; text-align: right; }
  .footer button { background: #1e3a5f; color: #fff; border: 0; padding: 8px 20px; font: inherit; }
</style>
</head>
<body>
<div class="bar">Harbor HR</div>
<div class="card">
  <h1 style="font-size:19px;margin-top:0">Employee portal</h1>
  <form id="hr-login" action="/portal/login" method="post">
    <div class="grid">
      <span id="lbl-user">Work email</span>
      <input id="emp" name="emp" type="text" aria-labelledby="lbl-user">
      <span id="lbl-pass">Portal password</span>
      <input id="emp-key" name="emp_key" type="password" aria-labelledby="lbl-pass">
    </div>
  </form>
</div>
<div class="footer">
  <a href="#reset" style="float:left;margin-top:7px">Reset password</a>
  <button type="submit" form="hr-login" id="hr-submit">Sign in</button>
</div>
<script>document.getElementById('hr-login').addEventListener('submit', function (e) { e.preventDefault(); });</script>
</body>
</html>
