<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Database console</title>
<style>
  body { margin: 0; font: 13px/1.4 Verdana, sans-serif; background: #eef2f6; color: #111; }
  #content { margin: 40px auto; width: 420px; background: #fff; border: 1px solid #b7c3d0; padding: 16px 20px; }
  h2 { margin: 0 0 12px; font-size: 16px; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-weight: normal; padding: 4px 8px 4px 0; width: 90px; }
  td { padding: 4px 0; }
  input:not([type=submit]), select { width: 100%; box-sizing: border-box; padding: 4px; }
  p { margin: 12px 0 0; }
</style>
</head>
<body>
<div id="content">
  <h2>Login</h2>
  <form action="" method="post">
    <table cellspacing="0">
      <tr><th>System</th><td><select name="auth[driver]" id="driver"><option value="server" selected>MySQL</option><option value="sqlite">SQLite</option><option value="pgsql">PostgreSQL</option></select></td></tr>
      <tr><th>Server</th><td><input name="auth[server]" id="server" value="" title="hostname[:port]" placeholder="localhost" autocapitalize="off"></td></tr>
      <tr><th>Username</th><td><input name="auth[username]" id="username" value="" autocomplete="username" autocapitalize="off"></td></tr>
      <tr><th>Password</th><td><input type="password" name="auth[password]" id="password" autocomplete="current-password"></td></tr>
      <tr><th>Database</th><td><input name="auth[db]" id="db" value="" autocapitalize="off"></td></tr>
    </table>
    <p><input type="submit" value="Login"> <label><input type="checkbox" name="auth[permanent]" value="1"> Permanent login</label></p>
  </form>
</div>
<script>document.querySelector('form').onsubmit = function (e) { e.preventDefault(); };</script>
</body>
</html>
