# Builds the Tauri desktop app (Windows installer, Linux packages), the browser extension
# packages and the CLI when a version tag is pushed, or by hand from the Actions tab. Unsigned:
# signing needs the publisher's certificates, which stay off GitHub for now. A pushed tag also
# publishes a GitHub release with the CLI archives and their SHA256SUMS only: that's what the
# site's install.sh and install.ps1 download (docs/platforms/cli.md#install). The Mac app is the native one
# (apps/macos, plan 19), built with pnpm build:macos; it has no job here until its Developer ID
# signing and notarization are set up.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables), all optional:
#   OCTAPASS_SERVER_URL            the "Octa Pass" server choice in these builds (e.g. https://vault.octap.app)
#   OCTAPASS_EXTRA_EXTENSION_IDS   extension IDs the desktop app accepts besides the store IDs
#                                  (e.g. oojckfebkmiogiahdggohbdnndbfcjnm,octa-pass@octap.app)
name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  VITE_SERVER_URL: ${{ vars.OCTAPASS_SERVER_URL }}
  OCTAPASS_EXTRA_EXTENSION_IDS: ${{ vars.OCTAPASS_EXTRA_EXTENSION_IDS }}

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - name: Tauri build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
            target
            apps/desktop/target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'apps/desktop/Cargo.lock', 'rust-toolchain.toml') }}
      - run: command -v wasm-pack || cargo install wasm-pack --locked --version 0.15.0
        shell: bash
      - run: cargo tauri --version || cargo install tauri-cli --locked --version 2.12.4
        shell: bash
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @octapass/core build
      - name: Build
        working-directory: apps/desktop
        run: cargo tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: |
            apps/desktop/target/release/bundle/nsis/*.exe
            apps/desktop/target/release/bundle/deb/*.deb
            apps/desktop/target/release/bundle/rpm/*.rpm
            apps/desktop/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/wasm-pack
            target
          key: release-ext-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: command -v wasm-pack || cargo install wasm-pack --locked --version 0.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @octapass/core build
      - name: Build and pack
        working-directory: apps/extension
        run: |
          mkdir -p ../../packages-out
          node scripts/build.ts --target chrome --store
          (cd dist/chrome && zip -qr -X ../../../../packages-out/octapass-chrome-edge-store.zip .)
          node scripts/build.ts --target chrome
          (cd dist/chrome && zip -qr -X ../../../../packages-out/octapass-chrome-edge-sideload.zip .)
          node scripts/build.ts --target firefox
          (cd dist/firefox && zip -qr -X ../../../../packages-out/octapass-firefox.zip .)
          (cd ../../packages-out && sha256sum -- *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: packages-out/
          if-no-files-found: error

  cli:
    name: CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: release-cli-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p octapass-cli --target ${{ matrix.target }}
      - name: Pack
        shell: bash
        run: |
          out="$PWD/cli-out"
          mkdir -p "$out"
          cd target/${{ matrix.target }}/release
          programs="octapass git-credential-octapass octapass-git-sign docker-credential-octapass"
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -tzip "$out/octapass-cli-${{ matrix.target }}.zip" $(for p in $programs; do echo "$p.exe"; done)
          else
            tar -czf "$out/octapass-cli-${{ matrix.target }}.tar.gz" $programs
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: cli-out/
          if-no-files-found: error

  publish:
    name: Publish the CLI release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: cli-out
      - name: Checksums and release
        working-directory: cli-out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -- octapass-cli-* > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --notes "The Octa Pass CLI. Install it with the one-line command in docs/platforms/cli.md." \
            octapass-cli-* SHA256SUMS
