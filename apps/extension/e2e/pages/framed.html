<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Checkout at Example shop</title>
    <style>
      body { font: 16px system-ui; margin: 2rem; }
      iframe { width: 32rem; height: 26rem; border: 1px solid #ccc; }
    </style>
  </head>
  <body>
    <h1>Checkout</h1>
    <p>Sign in to continue.</p>
    <!-- The frame's address comes from ?frame=, so one page serves the same-site and other-site cases. -->
    <iframe id="signin" title="Sign in"></iframe>
    <script>
      document.getElementById('signin').src = new URLSearchParams(location.search).get('frame');
    </script>
  </body>
</html>
