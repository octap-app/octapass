<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 바다숲 쇼핑</title>
<style>
  body { margin: 0; font: 15px/1.5 "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: #f5f6f7; color: #222; }
  .logo { text-align: center; font-size: 30px; font-weight: 800; color: #0e7490; margin: 60px 0 24px; }
  .panel { width: 420px; margin: 0 auto; background: #fff; border: 1px solid #dadada; border-radius: 6px; padding: 24px; }
  .row { margin-bottom: 10px; }
  .row label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
  .row input[type=text], .row input[type=password] { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #dadada; border-radius: 4px; font: inherit; }
  .keep { font-size: 13px; color: #555; margin: 8px 0 16px; }
  button { width: 100%; padding: 13px; border: 0; border-radius: 4px; background: #0e7490; color: #fff; font: inherit; font-size: 17px; font-weight: 700; }
  .links { text-align: center; font-size: 13px; color: #888; margin-top: 18px; }
  .links a { color: #888; text-decoration: none; margin: 0 6px; }
</style>
</head>
<body>
<div class="logo">바다숲</div>
<div class="panel">
  <form id="frmLogin" name="frmLogin" action="/member/login" method="post">
    <div class="row">
      <label for="loginId">아이디</label>
      <input type="text" id="loginId" name="loginId" maxlength="20">
    </div>
    <div class="row">
      <label for="loginPw">비밀번호</label>
      <input type="password" id="loginPw" name="loginPw" maxlength="20">
    </div>
    <div class="keep"><label><input type="checkbox" id="keepLogin" name="keepLogin"> 로그인 상태 유지</label></div>
    <button type="submit">로그인</button>
  </form>
</div>
<div class="links"><a href="#findId">아이디 찾기</a>|<a href="#findPw">비밀번호 찾기</a>|<a href="#join">회원가입</a></div>
<script>document.getElementById('frmLogin').onsubmit = function (e) { e.preventDefault(); };</script>
</body>
</html>
