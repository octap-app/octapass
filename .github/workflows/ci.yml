# Checks every push and pull request. Only GitHub's own actions are used, pinned to commits.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (core, server, FFI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Server tests on PostgreSQL
        run: cargo test -p octapass-server
        env:
          OCTAPASS_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Agent skills match the docs and the CLI's --help (docs/contributing/ai-agents.md)
        run: |
          cargo build -p octapass-cli --all-features --bin octapass
          python3 -m unittest discover -s skills/octapass-docs/tests
          OCTAPASS_BIN=target/debug/octapass python3 -m unittest discover -s skills/octapass-cli/tests

  apps-rust:
    name: Rust (desktop workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: apps-rust-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Desktop
        working-directory: apps/desktop
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test

  typescript:
    name: TypeScript, WASM and website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/wasm-pack
            target
            ~/.local/share/pnpm/store
          key: ts-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'pnpm-lock.yaml', 'rust-toolchain.toml') }}
      - run: command -v wasm-pack || cargo install wasm-pack --locked --version 0.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @octapass/core build
      - run: pnpm --filter @octapass/core test
      - name: Typecheck
        run: pnpm -r --if-present typecheck
      - name: Unit tests
        run: pnpm -r --if-present --filter '!@octapass/core' test
      - name: Native app strings and tokens are in sync (plan 17)
        run: |
          node tools/native-resources/generate.mjs --check
          node --test "tools/native-resources/test/*.test.mjs"
      - name: Translations are in step (docs/contributing/translations.md)
        run: |
          node tools/translations/sync.mjs export --check
          node tools/translations/check-docs.mjs
          node --test "tools/translations/test/*.test.mjs"
          node --test apps/website/src/i18n/landing/landing.test.mjs
          node --test apps/website/src/install/install.test.mjs
      - name: Native app fonts are the web vault's (plan 17)
        run: node --test "tools/native-fonts/test/*.test.mjs"
      - name: Client tests against a real server
        run: |
          pnpm --filter @octapass/vault-client test:server
          pnpm --filter @octapass/extension test:server
      - run: pnpm --filter @octapass/website build

  e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/wasm-pack
            target
            ~/.local/share/pnpm/store
          key: ts-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'pnpm-lock.yaml', 'rust-toolchain.toml') }}
      - run: command -v wasm-pack || cargo install wasm-pack --locked --version 0.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @octapass/core build
      - run: pnpm --filter @octapass/extension exec playwright install --with-deps chromium
      - run: pnpm --filter @octapass/web e2e
      - run: pnpm --filter @octapass/extension e2e
