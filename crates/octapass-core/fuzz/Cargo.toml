# Fuzz targets for every parser in octapass-core: importers, CSV preview, URL matching, password
# rules, backup files, share links, sealed keys, passkey requests, otpauth links, QR code images,
# and the Secret Key, recovery code and item formats. Needs nightly and cargo-fuzz; not run in CI.
#
#   cargo install cargo-fuzz
#   cd crates/octapass-core/fuzz && cargo +nightly fuzz run import_chrome
[package]
name = "octapass-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
octapass-core = { path = ".." }

# Not part of the main workspace.
[workspace]
members = ["."]

[[bin]]
name = "import_chrome"
path = "fuzz_targets/import_chrome.rs"
test = false
doc = false
bench = false

