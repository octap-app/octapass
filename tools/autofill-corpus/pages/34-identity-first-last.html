<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traveller details · Atlas Travel</title>
<style>
  body { margin: 0; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; background: #eef2f7; }
  .bar { background: #1e3a5f; color: #fff; padding: 14px 36px; font-size: 17px; }
  form { width: 600px; margin: 30px auto; background: #fff; border: 1px solid #cdd6e2; padding: 22px 30px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
  label { display: block; font-size: 13px; color: #334155; }
  input { display: block; width: 100%; box-sizing: border-box; margin-top: 3px; padding: 7px 9px; border: 1px solid #9fb0c6; border-radius: 3px; font: inherit; }
  button { margin-top: 18px; background: #1e3a5f; color: #fff; border: 0; padding: 8px 20px; font: inherit; }
</style>
</head>
<body>
<div class="bar">Atlas Travel · Booking 3 of 4</div>
<form id="profile" action="/booking/traveller" method="post">
  <h2 style="margin-top:0;font-size:18px">Lead traveller</h2>
  <div class="grid">
    <label>First name <input id="first" name="first_name"></label>
    <label>Last name <input id="last" name="last_name"></label>
    <label>Email <input id="pemail" name="personal_email" type="email"></label>
    <label>Mobile phone <input id="mobile" name="mobile" type="tel"></label>
    <label>Company (for business travel) <input id="company" name="company"></label>
    <label>Date of birth <input id="dob" name="dob" type="date"></label>
  </div>
  <button type="submit">Save and continue</button>
</form>
<script>document.getElementById('profile').onsubmit = function (e) { e.preventDefault(); };</script>
</body>
</html>
