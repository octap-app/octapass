<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password · Driftwood Games</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #18181b; color: #fafafa; }
  .box { width: 380px; margin: 90px auto; background: #27272a; border-radius: 12px; padding: 28px; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p { margin: 0 0 18px; color: #a1a1aa; font-size: 14px; }
  label { display: block; font-size: 13px; margin: 12px 0 4px; color: #d4d4d8; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #3f3f46; border-radius: 8px; background: #18181b; color: #fafafa; font: inherit; }
  button { margin-top: 20px; width: 100%; padding: 11px; border: 0; border-radius: 8px; background: #f97316; color: #18181b; font: inherit; font-weight: 700; }
  #msg { margin-top: 12px; color: #4ade80; }
</style>
</head>
<body>
<div class="box">
  <h1>Reset your password</h1>
  <p>Choose a new password for your Driftwood account.</p>
  <form id="reset" action="/account/reset?token=7c1e" method="post">
    <label for="password">New password</label>
    <input id="password" name="password" type="password">
    <label for="password_confirmation">Confirm new password</label>
    <input id="password_confirmation" name="password_confirmation" type="password">
    <button type="submit" id="reset-btn">Reset password</button>
  </form>
  <div id="msg" role="status"></div>
</div>
<script>
  document.getElementById('reset').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('msg').textContent = 'Your password has been reset.';
  });
</script>
</body>
</html>
