[package]
name = "octapass-login-item"
description = "Opening the Octa Pass desktop app in the background when the person signs in to the computer: a launch agent on macOS, the Run key on Windows, an XDG autostart entry on Linux; and a watchdog that starts it again after a force quit or a crash."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile.workspace = true
