[package]
name = "octapass-net-tools"
version = "0.1.0"
description = "The developer toolkit's few parts that touch the network or the operating system: live certificates, JWKS, ACME and the system trust store."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
octapass-core = { path = "../octapass-core" }
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
# Blocking on purpose: these run for a moment, from a command or a background task. Native root
# certificates aren't needed: reqwest in the CLI and `ureq` here both use webpki-roots.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
webpki-roots = "1"

[dev-dependencies]
der = "0.7"
tempfile = "3"
x509-cert = { version = "0.2.5", default-features = false, features = ["pem", "std"] }
