<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to Example</title>
    <style>
      body { font: 17px -apple-system, sans-serif; margin: 40px 24px; }
      input { display: block; width: 100%; font-size: 17px; padding: 10px; margin: 6px 0 18px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <h1>Sign in to Example</h1>
    <form action="#" method="post">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" />
      <button type="submit">Sign in</button>
    </form>
  </body>
</html>
