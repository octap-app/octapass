<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Fitness | Member login</title>
<style>
  body { margin: 0; font: 15px "Helvetica Neue", Arial, sans-serif; background: #fff7ed; }
  .shell { width: 400px; margin: 70px auto; padding: 32px; background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(234,88,12,.15); }
  h1 { margin: 0 0 22px; color: #ea580c; }
  .float { position: relative; margin-bottom: 18px; }
  .float input { width: 100%; box-sizing: border-box; padding: 20px 12px 6px; border: 2px solid #fed7aa; border-radius: 10px; font: inherit; outline: none; }
  .float input:focus { border-color: #ea580c; }
  .float label { position: absolute; left: 14px; top: 15px; color: #9a6b4b; pointer-events: none; transition: all .15s; }
  .float input:focus + label, .float input:not(:placeholder-shown) + label { top: 4px; font-size: 11px; color: #ea580c; }
  button { width: 100%; padding: 13px; border: 0; border-radius: 10px; background: #ea580c; color: #fff; font: inherit; font-weight: 700; }
</style>
</head>
<body>
<div class="shell">
  <h1>Member login</h1>
  <form id="member-login" action="/members/login" method="post">
    <div class="float">
      <input id="fl-user" name="member" type="text" placeholder=" ">
      <label for="fl-user">Username</label>
    </div>
    <div class="float">
      <input id="fl-pass" name="secret" type="password" placeholder=" ">
      <label for="fl-pass">Password</label>
    </div>
    <button type="submit">Let's go</button>
  </form>
</div>
<script>document.getElementById('member-login').onsubmit = function (e) { e.preventDefault(); };</script>
</body>
</html>
