<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Acme Notes</title>
<style>
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #f4f1ea; color: #222; }
  header { padding: 14px 32px; background: #fff; border-bottom: 1px solid #e3ddd0; font-weight: 700; }
  main { display: flex; justify-content: center; padding-top: 70px; }
  form { width: 340px; background: #fff; padding: 28px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 0 0 18px; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #c9c2b4; border-radius: 6px; font: inherit; }
  button { margin-top: 18px; width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #c2410c; color: #fff; font: inherit; font-weight: 600; }
  .links { margin-top: 12px; font-size: 13px; text-align: center; }
</style>
</head>
<body>
<header>Acme Notes</header>
<main>
  <form id="login" action="/session" method="post">
    <h1>Sign in to Acme Notes</h1>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">Sign in</button>
    <p class="links"><a href="#forgot">Forgot your password?</a> · <a href="#signup">Create an account</a></p>
    <p id="status" role="status"></p>
  </form>
</main>
<script>
  document.getElementById('login').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('status').textContent = 'Signed in';
  });
</script>
</body>
</html>
